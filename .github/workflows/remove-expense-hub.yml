name: Remove Expense Hub

on:
  push:
    branches: [nile-1-v2-fixes]

permissions:
  contents: write

jobs:
  remove-expense-hub:
    if: "!contains(github.event.head_commit.message, 'remove Expense Hub from NILE 1')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Expense Hub references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Remove the dedicated module from the application shell.
          p = Path('App.tsx')
          s = p.read_text()
          s = s.replace("import ExpenseHub from './screens/ExpenseHub';\n", '')
          s = re.sub(r"\n\s*case 'expense-hub': return <ExpenseHub[^;]*;", '', s)
          p.write_text(s)

          # Remove the navigation item from every menu definition in Layout.
          p = Path('components/Layout.tsx')
          s = p.read_text()
          s = re.sub(r"\n\s*\{ id: 'expense-hub', label: t\.expenseHub, icon: '🧾' \},", '', s)
          p.write_text(s)

          # Remove the dedicated page. Expense records/data services are intentionally
          # left untouched so existing financial data is not destroyed.
          page = Path('screens/ExpenseHub.tsx')
          if page.exists():
              page.unlink()
          PY

          # Remove stale permission references only; do not remove expense data APIs.
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in {'.ts','.tsx'}:
                  continue
              try:
                  s = path.read_text()
              except Exception:
                  continue
              original = s
              s = re.sub(r"['\"]expense-hub['\"]\s*,?", '', s)
              if s != original:
                  path.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No Expense Hub changes required.'
          else
            git commit -m "chore: remove Expense Hub from NILE 1"
            git push
          fi

      - name: Cleanup temporary workflow
        if: always()
        shell: bash
        run: |
          git rm .github/workflows/remove-expense-hub.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: cleanup Expense Hub removal workflow"
          git push
